<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charts — Agro</title>
    <meta name="description" content="Top 50 on Agro: what the fleet has been playing, counted with no account attached. No login required." />

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0" />

    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='42' fill='%23D0BCFF'/%3E%3Cpath fill='%23381E72' d='M16 63C16 57 19 53 25 51L38 47C44 45 48 41 51 34C52 31 54 29 57 29L58 15C58 11 63 10 65 14L71 28C79 31 85 38 87 48C89 60 86 71 81 79C79 83 77 86 76 88L48 88C48 79 45 73 39 70C33 67 27 68 22 70C18 71 16 68 16 63Z'/%3E%3C/svg%3E" />

    <link rel="stylesheet" href="charts.css" />
  </head>
  <body>
    <div class="navbar-wrapper" id="navbar-wrapper">
      <header class="navbar">
        <div class="navbar-inner">
          <a href="../" class="nav-brand">
            <svg viewBox="0 0 108 108"><rect width="108" height="108" rx="36" fill="#D0BCFF"/><path fill="#381E72" d="M16 63C16 57 19 53 25 51L38 47C44 45 48 41 51 34C52 31 54 29 57 29L58 15C58 11 63 10 65 14L71 28C79 31 85 38 87 48C89 60 86 71 81 79C79 83 77 86 76 88L48 88C48 79 45 73 39 70C33 67 27 68 22 70C18 71 16 68 16 63Z"/></svg>
            Agro
          </a>
          <nav class="nav-links">
            <a href="../" class="nav-link">Home</a>
            <a href="./" class="nav-link nav-link-current" aria-current="page">Charts</a>
          </nav>
          <div class="nav-actions">
            <a href="https://github.com/AgroUPlus/Agro" target="_blank" rel="noopener" class="btn btn-tonal btn-sm">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
              GitHub
            </a>
            <a href="https://agro.kolbxyz.xyz" id="dashboard-link" class="btn btn-filled btn-sm">
              <span class="material-symbols-rounded" style="font-size:16px;">dashboard</span>
              Dashboard
            </a>
          </div>
        </div>
      </header>
    </div>

    <main class="page charts-page">
      <div class="container" style="max-width: 1080px;">
        <div class="charts-header">
          <div>
            <span class="section-badge">
              <span class="material-symbols-rounded" style="font-size:18px;">bar_chart</span>
              Charts
            </span>
            <h1 class="section-title" style="margin-top:10px;">Top 50 on Agro</h1>
            <div class="charts-server">Server: <span id="server-display"></span></div>
          </div>
          <button class="btn btn-tonal btn-sm" onclick="openServerModal()">
            <span class="material-symbols-rounded" style="font-size:16px;">dns</span>
            Change server
          </button>
        </div>

        <div class="segmented" id="window-switcher"></div>

        <div class="card" id="chart-card">
          <div class="chart-list" aria-busy="true"></div>
        </div>
      </div>
    </main>

    <!-- Change-server dialog, mirroring the home page's Connect dialog -->
    <div class="modal-backdrop" id="server-backdrop" role="dialog" aria-modal="true" aria-labelledby="server-modal-title">
      <div class="modal">
        <button class="modal-close" onclick="closeServerModal()" aria-label="Close dialog"><span class="material-symbols-rounded">close</span></button>
        <h3 id="server-modal-title" style="font-size:1.3rem;font-weight:900;color:var(--md-sys-color-on-surface);margin-bottom:6px;">Change server</h3>
        <p style="font-size:13.5px;color:var(--md-sys-color-on-surface-variant);">Point this chart at any Agro server. Nothing here requires signing in.</p>
        <label for="server-input" class="sr-only">Server URL</label>
        <input class="modal-input" id="server-input" type="text" placeholder="https://agro.example.com" aria-label="Server URL" />
        <div style="display:flex;gap:12px;justify-content:flex-end;">
          <button class="btn btn-tonal btn-sm" onclick="closeServerModal()">Cancel</button>
          <button class="btn btn-filled btn-sm" onclick="saveServer()">Save</button>
        </div>
      </div>
    </div>

    <script src="charts.js"></script>
    <script src="../nav.js"></script>
    <script src="../cursor.js"></script>
  </body>
</html>
