name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      # Anything that can change the OpenAPI document: the annotations live on the handlers
      # themselves, not in one file, so the spec has to be regenerated on any source change.
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate the OpenAPI document
        run: |
          # rust-embed needs this directory to exist at compile time; its contents are the built
          # dashboard, which `dump-openapi` never touches, so an empty directory is enough here.
          mkdir -p dashboard/dist docs/api
          cargo run --quiet -- dump-openapi > docs/api/openapi.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
