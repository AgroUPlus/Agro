name: Agro CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm --prefix dashboard ci --ignore-scripts

      - name: Build Dashboard
        run: npm --prefix dashboard run build

  server:
    name: Rust Server Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Build Dashboard for Embedding
        run: |
          npm --prefix dashboard ci --ignore-scripts
          npm --prefix dashboard run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (stable)
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.7.7

      - name: Check Formatting
        run: cargo fmt --check

      - name: Clippy Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Test Suite & Boundary Checks
        run: cargo test --all-targets

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [dashboard, server]
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  commit-lint:
    name: Lint Commits & CLA Compliance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify No Forbidden AI Trailers
        run: |
          COMMITS=$(git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%H")
          for COMMIT in $COMMITS; do
            MSG=$(git log -1 --pretty=format:"%B" $COMMIT)
            if echo "$MSG" | grep -Eiq "(Co-Authored-By:.*(claude|anthropic|chatgpt|openai|copilot|gemini|deepseek|qwen|ai\b)|generated by (claude|chatgpt|copilot|ai\b))"; then
              echo "::error::Commit $COMMIT contains forbidden AI co-authorship trailer per CLA.md Section 8."
              exit 1
            fi
          done
          echo "All PR commits comply with CLA Section 8."

