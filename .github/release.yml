changelog:
  exclude:
    labels:
      - ignore
      - internal
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: "✨ Features & Enhancements"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - fix
        - bug
    - title: "🔄 Ecosystem & Synchronization"
      labels:
        - sync
        - handoff
        - relay
    - title: "🔒 Security & Privacy"
      labels:
        - security
    - title: "📖 Documentation & Governance"
      labels:
        - documentation
        - docs
    - title: "🧹 Maintenance & Build"
      labels:
        - maintenance
        - chore
        - dependencies
        - ci
